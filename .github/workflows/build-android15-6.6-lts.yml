name: 🏗️ MOTO G75 - V19.2 ULTRA SLIM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Dependências
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel (GKI 6.6)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/kernel/common -b android15-6.6 --depth=1 android-kernel

    - name: ඞ Injetar KernelSU Next + SusFS
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        mkdir -p fs include/linux
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h

    - name: 🔧 Configuração "Corte Cirúrgico"
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        # Primeiro gera o config padrão sem erros
        make O=out ARCH=arm64 gki_defconfig
        
        # Agora aplicamos as melhorias e os cortes de tamanho
        ./scripts/config --file out/.config \
          -e CONFIG_KSU_NEXT_MANUAL_HOOK \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_TCP_CONG_BBR \
          -e CONFIG_NETFILTER_XT_TARGET_HL \
          -e CONFIG_IP_SET \
          -e CONFIG_CC_OPTIMIZE_FOR_SIZE \
          -e CONFIG_LTO_CLANG_THIN \
          -d CONFIG_DEBUG_KERNEL \
          -d CONFIG_DEBUG_INFO \
          -d CONFIG_KALLSYMS \
          -d CONFIG_WLAN_VENDOR_INTEL \
          -d CONFIG_WLAN_VENDOR_MEDIATEK \
          -d CONFIG_WLAN_VENDOR_REALTEK \
          -d CONFIG_DRM_AMDGPU \
          -d CONFIG_DRM_NOUVEAU \
          --set-str CONFIG_LOCALVERSION "-HMBIRD-V19.3"

    - name: 🏗️ Compilação Otimizada
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1
        
        # Strip Total
        llvm-strip --strip-all out/arch/arm64/boot/Image
        
        # Compressão X
