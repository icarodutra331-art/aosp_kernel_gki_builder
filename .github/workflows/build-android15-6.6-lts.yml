name: 🏗️ MOTO G75 - V27 XUANYUAN METHOD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/kernel/common -b android15-6.6 --depth=1 android-kernel

    - name: ඞ Aplicar Patches do Repositório Xuanyuan
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        # Injetar KSU Next
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # Baixar o Patch do SusFS que você encontrou no repositório
        curl -L "https://raw.githubusercontent.com/Xennet7/XUANYUAN-KERNEL-SUSFS-GKI/dev/mksu_ksud.patch" -o susfs.patch
        patch -p1 < susfs.patch || echo "Patch falhou, mas seguindo..."
        
        # Baixar arquivos core do SusFS
        mkdir -p fs include/linux
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h
        echo "obj-y += susfs.o" >> fs/Makefile

    - name: 🔧 Configuração Slim (Fim dos 8MB)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make O=out ARCH=arm64 gki_defconfig
        
        ./scripts/config --file out/.config \
          -e CONFIG_KSU_NEXT_MANUAL_HOOK \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_TCP_CONG_BBR \
          -e CONFIG_IP_SET \
          -d CONFIG_DEBUG_INFO \
          -d CONFIG_DEBUG_INFO_BTF \
          -e CONFIG_CC_OPTIMIZE_FOR_SIZE \
          --set-str CONFIG_LOCALVERSION "-XUANYUAN-HMBIRD"

    - name: 🏗️ Compilação Final
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1
        
        llvm-strip --strip-all out/arch/arm64/boot/Image
        xz -9 -e -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz
        
        echo "TAMANHO FINAL:" && du -h out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        cd AnyKernel3 && zip -r ../G75-XUANYUAN-FINAL.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: G75-XUANYUAN-RELEASE
        path: G75-XUANYUAN-FINAL.zip
