name: 🏗️ MOTO G75 - V19.6 FIX
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Dependências
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/kernel/common -b android15-6.6 --depth=1 android-kernel

    - name: ඞ Injetar KernelSU Next + SusFS (FORÇADO)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        # KernelSU Next
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # SusFS - Criando pastas e baixando com verificação
        mkdir -p fs
        mkdir -p include/linux
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h
        
        # VERIFICAÇÃO CRÍTICA: Se o arquivo não existir, o script para aqui e te avisa
        if [ ! -f "fs/susfs.c" ]; then echo "ERRO: fs/susfs.c não foi baixado!"; exit 1; fi
        if [ ! -f "include/linux/susfs.h" ]; then echo "ERRO: susfs.h não foi baixado!"; exit 1; fi

    - name: 🔧 Configuração V19.6 (Estável)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make O=out ARCH=arm64 gki_defconfig
        
        ./scripts/config --file out/.config \
          -e CONFIG_KSU_NEXT_MANUAL_HOOK \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_TCP_CONG_BBR \
          -e CONFIG_NETFILTER_XT_TARGET_HL \
          -e CONFIG_IP_SET \
          -e CONFIG_CC_OPTIMIZE_FOR_SIZE \
          -d CONFIG_DEBUG_INFO \
          -d CONFIG_DEBUG_INFO_BTF \
          --set-str CONFIG_LOCALVERSION "-HMBIRD-STABLE"

    - name: 🏗️ Compilação
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1
        
        llvm-strip --strip-debug out/arch/arm64/boot/Image
        xz -9 -e --check=crc32 out/arch/arm64/boot/Image
        
        echo "TAMANHO FINAL:" && du -h out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp $GITHUB_WORKSPACE/init_boot.img AnyKernel3/init_boot.img
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        
        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=HMBIRD-V19.6-G75
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        '; }
        block=/dev/block/by-name/init_boot;
        is_slot_device=1;
        . tools/ak3-core.sh;
        split_boot;
        flash_boot;
        EOF
        cd AnyKernel3 && zip -r ../G75-V19.6.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: G75-V19.6-FINAL
        path: G75-V19.6.zip
