name: 🏗️ MOTO G75 - V24 SUSFS READY
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://android.googlesource.com/kernel/common"
      KERNEL_SOURCE_BRANCH: "android15-6.6"
      KERNEL_CONFIG: "gki_defconfig"
      ARCH: "arm64"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: ඞ Injetar KSU Next + SusFS (Compatível com Módulo)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        # KernelSU Next
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # SusFS - Injetando os arquivos do repositório do sidex15
        mkdir -p fs include/linux
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h
        
        # Registro no Makefile (Obrigatório para compilar)
        echo "obj-y += susfs.o" >> fs/Makefile
        
        # Patch para evitar o erro de redefinição (Duplicate Definition)
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' fs/susfs.c 2>/dev/null || true

    - name: 🔧 Configuração V24 (Base V10 + Otimização de Peso)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        CONF="arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        
        # Configurações da V10 que funcionaram
        echo "CONFIG_KSU_NEXT_MANUAL_HOOK=y" >> $CONF
        echo "CONFIG_TCP_CONG_BBR=y" >> $CONF
        echo "CONFIG_IP_SET=y" >> $CONF
        echo "CONFIG_NETFILTER_XT_TARGET_HL=y" >> $CONF
        
        # Ativando Suporte ao SusFS para o Módulo
        echo "CONFIG_KSU_SUSFS=y" >> $CONF
        
        # ✂️ O CORTE DE GORDURA (Para sair dos 8MB)
        echo "# CONFIG_DEBUG_INFO is not set" >> $CONF
        echo "# CONFIG_DEBUG_KERNEL is not set" >> $CONF
        echo "# CONFIG_KALLSYMS is not set" >> $CONF
        echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> $CONF
        
        sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-HMBIRD-SUSFS-V24"/g' $CONF

    - name: 🏗️ Compilação
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1 ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1
        
        # Limpeza de símbolos para reduzir tamanho
        llvm-strip --strip-all out/arch/arm64/boot/Image
        
        # Compressão Máxima
        xz -9 -e -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz
        
        echo "TAMANHO FINAL DO KERNEL:" && du -h out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        
        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=HMBIRD-V24-G75-SUSFS
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        '; }
        block=auto;
        is_slot_device=auto;
        . tools/ak3-core.sh;
        split_boot;
        flash_boot;
        EOF
        cd AnyKernel3 && zip -r ../G75-V24-FINAL.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: G75-V24-SUSFS-RELEASE
        path: kernel_workspace/G75-V24-FINAL.zip
