name: 🏗️ MOTO G75 - V69 NEXT
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://android.googlesource.com/kernel/common"
      KERNEL_SOURCE_BRANCH: "android15-6.6"
      KERNEL_CONFIG: "gki_defconfig"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: ඞ Injetar KernelSU NEXT + SusFS
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        # 1. Injeta especificamente o NEXT (Puxando a branch estável)
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        
        # 2. SusFS Oficial (Links estáveis do GitLab para evitar o erro 404)
        mkdir -p fs include/linux
        curl -LSs "https://gitlab.com/simonpunk/susfs4kernel/-/raw/master/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -LSs "https://gitlab.com/simonpunk/susfs4kernel/-/raw/master/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h
        
        # 3. Validar download (Segurança HMBIRD)
        if grep -q "404: Not Found" fs/susfs.c; then echo "ERRO: Falha no download do SusFS"; exit 1; fi

        # 4. Registrar no Makefile e Renomear Struct (Solução Raiz)
        sed -i '/susfs.o/d' fs/Makefile
        echo "obj-y += susfs.o" >> fs/Makefile
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' fs/susfs.c || true
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' include/linux/susfs.h || true

    - name: 🔧 Configuração PRO (HMBIRD Pack)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
        
        KCONFIG="out/.config"
        # Arsenal Completo HMBIRD
        scripts/config --file $KCONFIG -e KSU
        scripts/config --file $KCONFIG -e KSU_NEXT
        scripts/config --file $KCONFIG -e KSU_SUSFS
        scripts/config --file $KCONFIG -e TCP_CONG_BBR
        scripts/config --file $KCONFIG -e NETFILTER_XT_TARGET_HL
        scripts/config --file $KCONFIG -e NETFILTER_XT_TARGET_TTL
        scripts/config --file $KCONFIG -e IP_SET
        scripts/config --file $KCONFIG -e IP6_NF_NAT
        scripts/config --file $KCONFIG -e IP6_NF_TARGET_MASQUERADE
        scripts/config --file $KCONFIG -e NLS_UTF8
        scripts/config --file $KCONFIG -e UNICODE
        scripts/config --file $KCONFIG --set-str LOCALVERSION "-S928B-HMBIRD-V69"
        
        # Sincronização obrigatória de dependências
        make O=out ARCH=arm64 olddefconfig

    - name: 🏗️ Compilação e Strip
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1
        
        llvm-strip --strip-debug out/arch/arm64/boot/Image
        xz -9 -e -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3 (Cópia fiel do XKNXT - The Terminator)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        
        # Script AnyKernel IDÊNTICO às imagens 1 e 10
        cat <<EOF > AnyKernel3/anykernel.sh
        ### AnyKernel setup
        # global properties
        properties() { '
        kernel.string=XENNET Kernels by Xennet The Terminator
        do.devicecheck=0
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=
        device.name2=
        device.name3=
        device.name4=
        device.name5=
        supported.versions=
        supported.patchlevels=
        supported.vendorpatchlevels=
        '; } # end properties

        ### AnyKernel install
        ## boot shell variables
        block=boot;
        is_slot_device=auto;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        no_magisk_check=1;

        # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
        . tools/ak3-core.sh;

        kernel_version=\$(cat /proc/version | awk -F '-' '{print \$1}' | awk '{print \$3}')
        case \$kernel_version in
          5.1*) ksu_supported=true ;;
          6.1*) ksu_supported=true ;;
          6.6*) ksu_supported=true ;;
          *) ksu_supported=false ;;
        esac

        ui_print " " "  -> ksu_supported: \$ksu_supported"
        \$ksu_supported || abort "  -> Non-GKI device, abort."

        # boot install
        split_boot;
        if [ -f "split_img/ramdisk.cpio" ]; then
            unpack_ramdisk;
            write_boot;
        else
            flash_boot;
        fi
        ## end boot install
        EOF
        
        cd AnyKernel3 && zip -r ../G75-V69-XKNXT.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HMBIRD-V69-FINAL
        path: G75-V69-XKNXT.zip
