name: 🏗️ MOTO G75 - V60 HMBIRD-V10M
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://android.googlesource.com/kernel/common"
      KERNEL_SOURCE_BRANCH: "android15-6.6"
      KERNEL_CONFIG: "gki_defconfig"
      ARCH: "arm64"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: ඞ Injetar KernelSU Next + SusFS (Build Pack)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        # Setup KSU Next
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # Download SusFS
        mkdir -p fs include/linux
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h
        
        # Fix Makefile & Conflito de Struct (Evita Error 2)
        sed -i '/susfs.o/d' fs/Makefile
        echo "obj-y += susfs.o" >> fs/Makefile
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' fs/susfs.c || true
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' include/linux/susfs.h || true

    - name: 🔧 Configuração V60 (Arsenal Completo - Sem Cortes)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        CONF="arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        
        # --- KERNELSU & SUSFS ---
        echo "CONFIG_KSU=y" >> $CONF
        echo "CONFIG_KSU_NEXT_MANUAL_HOOK=y" >> $CONF
        echo "CONFIG_KSU_SUSFS=y" >> $CONF

        # --- PERFORMANCE & REDE (BBR, TTL, IP_SET, NAT) ---
        echo "CONFIG_TCP_CONG_BBR=y" >> $CONF
        echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $CONF
        echo "CONFIG_NETFILTER_XT_TARGET_HL=y" >> $CONF
        echo "CONFIG_NETFILTER_XT_TARGET_TTL=y" >> $CONF
        echo "CONFIG_IP_SET=y" >> $CONF
        echo "CONFIG_IP6_NF_NAT=y" >> $CONF
        echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> $CONF

        # --- SUPORTE UNICODE (UnicodePad/Emoji) ---
        echo "CONFIG_NLS_UTF8=y" >> $CONF
        echo "CONFIG_UNICODE=y" >> $CONF
        
        # --- IDENTIDADE & OTIMIZAÇÃO ---
        # Removido os bloqueios de Som/Wi-Fi da V10 original pois agora temos espaço!
        sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-S928B-HMBIRD-V60"/g' $CONF
        echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> $CONF

    - name: 🏗️ Compilação Turbo
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1 ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1
        
        # Limpeza e compressão máxima
        llvm-strip --strip-debug out/arch/arm64/boot/Image
        xz -9 -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3 (Lógica Xennet Terminator)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        
        cat <<EOF > AnyKernel3/anykernel.sh
        ### AnyKernel setup
        properties() { '
        kernel.string=HMBIRD-V60-V10M by Gemini
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        ### AnyKernel install
        block=boot;
        is_slot_device=auto;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        no_magisk_check=1;

        . tools/ak3-core.sh;

        # Lógica de detecção GKI (Xennet Style)
        kernel_version=\$(cat /proc/version | awk -F '-' '{print \$1}' | awk '{print \$3}')
        case \$kernel_version in
            5.1*) ksu_supported=true ;;
            6.1*) ksu_supported=true ;;
            6.6*) ksu_supported=true ;;
            *) ksu_supported=false ;;
        esac

        ui_print " " "  -> ksu_supported: \$ksu_supported"
        \$ksu_supported || abort "  -> Non-GKI device, abort."

        split_boot;
        if [ -f "split_img/ramdisk.cpio" ]; then
            unpack_ramdisk;
            write_boot;
        else
            flash_boot;
        fi
        EOF
        
        cd AnyKernel3 && zip -r ../G75-V60-V10M.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HMBIRD-V60-FINAL
        path: G75-V60-V10M.zip
