name: 🏗️ MOTO G75 - V17 FINAL SAVIOR
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://android.googlesource.com/kernel/common"
      KERNEL_SOURCE_BRANCH: "android15-6.6"
      KERNEL_CONFIG: "gki_defconfig"
      ARCH: "arm64"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: ඞ Injetar KernelSU Next + SusFS
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        mkdir -p fs include/linux
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h

    - name: 🔧 Configuração V17 (Ajuste de Tamanho Extremo)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
        
        ./scripts/config --file out/.config \
          -e CONFIG_KSU_NEXT_MANUAL_HOOK \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_TCP_CONG_BBR \
          -e CONFIG_CC_OPTIMIZE_FOR_SIZE \
          -d CONFIG_DEBUG_KERNEL \
          -d CONFIG_DEBUG_INFO \
          --set-str CONFIG_LOCALVERSION "-HMBIRD-V17"

    - name: 🏗️ Compilação e Redução de Tamanho
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1
        
        # 1. Strip dos símbolos para ganhar espaço (Essencial para < 6MB)
        llvm-strip --strip-debug out/arch/arm64/boot/Image
        
        # 2. Compressão XZ Nível 9 (O melhor que existe)
        xz -9 -e -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz
        
        # Verificar tamanho para o usuário
        ls -lh out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3 (Caminho Especial)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=HMBIRD-V17-G75
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        '; }
        # Motorola G75 usa init_boot
        block=/dev/block/by-name/init_boot;
        is_slot_device=1;
        . tools/ak3-core.sh;
        split_boot;
        flash_boot;
        EOF
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        cd AnyKernel3 && zip -r ../HMBIRD-V17.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HMBIRD-V17-FINAL
        path: kernel_workspace/HMBIRD-V17.zip
