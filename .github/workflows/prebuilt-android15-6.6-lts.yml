name: 🏗️ MOTO G75 - V7 ULTIMATE HMBIRD (XZ COMPRESS)
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://android.googlesource.com/kernel/common"
      KERNEL_SOURCE_BRANCH: "android15-6.6"
      KERNEL_CONFIG: "gki_defconfig"
      ARCH: "arm64"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas (XZ incluído)
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Memória Swap (10GB)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: ඞ Injetar KernelSU Next + SusFS
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        mkdir -p fs include/linux
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h

    - name: 🔧 Build HMBIRD (Dieta Extrema V7)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        # 🧊 OTIMIZAÇÃO PARA TAMANHO MÁXIMO
        echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_DEBUG_INFO_NONE=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_DEBUG_KERNEL is not set" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_FTRACE is not set" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_STACKTRACE is not set" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        
        # 🚀 PERFORMANCE (BBR + BBG)
        echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_SCHED_AUTOGROUP=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        
        # 🧱 REDE (IP_SET + IPv6 NAT + TTL)
        echo "CONFIG_IP_SET=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_IP_SET_HASH_IP=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_IP6_NF_NAT=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_NETFILTER_XT_TARGET_HL=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        
        # 🛡️ ROOT & SUSFS
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        
        # 📱 SPOOFING S24 Ultra
        sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-S928B-HMBIRD-G75-V7"/g' arch/arm64/configs/${{ env.KERNEL_CONFIG }}

    - name: 🏗️ Compilação e Compressão XZ (-9)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1 ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1
        
        # O COMPRESSOR MAIS FORTE: XZ
        xz -9 -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3 Final V7
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=HMBIRD-V7-G75-ULTRA-SLIM
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        '; }
        block=auto;
        is_slot_device=auto;
        . tools/ak3-core.sh;
        split_boot;
        flash_boot;
        EOF
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        cd AnyKernel3 && zip -r ../AnyKernel3-G75-V7.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HMBIRD-G75-V7-FINAL
        path: kernel_workspace/AnyKernel3-G75-V7.zip
