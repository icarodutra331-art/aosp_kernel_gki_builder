name: 🏗️ MOTO G75 - V29 FINAL HOPE
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://android.googlesource.com/kernel/common"
      KERNEL_SOURCE_BRANCH: "android15-6.6"
      KERNEL_CONFIG: "gki_defconfig"
      ARCH: "arm64"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: ඞ Injetar KSU Next + SusFS (Sem Patches Conflitantes)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        # Injetar KSU Next Oficial
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # SusFS - Injeção Direta (Igual você tentou antes, mas com fix de conflito)
        mkdir -p fs include/linux
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h
        
        # Registrar o SusFS no Makefile (O segredo é colocar no topo para o compilador ler primeiro)
        sed -i '1i obj-y += susfs.o' fs/Makefile
        
        # Renomear struct para evitar o erro de "Duplicate Definition"
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' fs/susfs.c || true

    - name: 🔧 Configuração V29 (Base V10 + Filtro de Tamanho)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        CONF="arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        
        # O QUE FUNCIONOU NA V10:
        echo "CONFIG_KSU_NEXT_MANUAL_HOOK=y" >> $CONF
        echo "CONFIG_KSU_SUSFS=y" >> $CONF
        echo "CONFIG_TCP_CONG_BBR=y" >> $CONF
        echo "CONFIG_IP_SET=y" >> $CONF
        echo "CONFIG_NETFILTER_XT_TARGET_HL=y" >> $CONF
        
        # ✂️ O QUE VAI TIRAR OS 8MB (A FACADA):
        echo "# CONFIG_DEBUG_INFO is not set" >> $CONF
        echo "# CONFIG_DEBUG_MISC is not set" >> $CONF
        echo "# CONFIG_SECTION_MISMATCH_WARN_DETECTION is not set" >> $CONF
        echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> $CONF
        
        sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-HMBIRD-V29-FINAL"/g' $CONF

    - name: 🏗️ Compilação e Strip Total
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1 ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) O=out ARCH=${{ env.ARCH }} CC=clang LLVM=1 LLVM_IAS=1
        
        # Remove símbolos de depuração (Crucial para o tamanho)
        llvm-strip --strip-all out/arch/arm64/boot/Image
        
        # Compressão Máxima
        xz -9 -e -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz
        
        echo "TAMANHO FINAL:" && du -h out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        
        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=HMBIRD-V29-G75
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        '; }
        block=auto;
        is_slot_device=auto;
        . tools/ak3-core.sh;
        split_boot;
        flash_boot;
        EOF
        cd AnyKernel3 && zip -r ../G75-V29-FINAL.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: G75-V29-FINAL
        path: kernel_workspace/G75-V29-FINAL.zip
