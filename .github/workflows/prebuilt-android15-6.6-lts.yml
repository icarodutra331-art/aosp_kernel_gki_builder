name: 🏗️ MOTO G75 - V57 FINAL BEAST
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://android.googlesource.com/kernel/common"
      KERNEL_SOURCE_BRANCH: "android15-6.6"
      KERNEL_CONFIG: "gki_defconfig"
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Instalar Ferramentas
      run: |
        sudo apt update && sudo apt install -y git ccache flex bison build-essential bc curl libssl-dev libelf-dev clang lld llvm xz-utils zip
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Fonte Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: ඞ SusFS + Fix de Conflito (DNA HMBIRD)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        mkdir -p fs include/linux
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.c" -o fs/susfs.c
        curl -L "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' fs/susfs.c || true
        sed -i 's/struct susfs_file_struct/struct susfs_file_struct_ksu/g' include/linux/susfs.h || true
        sed -i '/susfs.o/d' fs/Makefile
        echo "obj-y += susfs.o" >> fs/Makefile

    - name: 🔧 Configuração "Full Pack" (Tudo o que você pediu)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        CONF="arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
        
        # ROOT & CLOAK
        echo "CONFIG_KSU=y" >> $CONF
        echo "CONFIG_KSU_NEXT_MANUAL_HOOK=y" >> $CONF
        echo "CONFIG_KSU_SUSFS=y" >> $CONF

        # REDE & BYPASS (BBR, TTL, IP_SET, IPv6 NAT)
        echo "CONFIG_TCP_CONG_BBR=y" >> $CONF
        echo "CONFIG_NETFILTER_XT_TARGET_HL=y" >> $CONF
        echo "CONFIG_IP_SET=y" >> $CONF
        echo "CONFIG_IP6_NF_NAT=y" >> $CONF
        echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> $CONF
        echo "CONFIG_NETFILTER_XT_TARGET_TTL=y" >> $CONF

        # UNICODE & EMOJI (Suporte UnicodePad)
        echo "CONFIG_NLS_UTF8=y" >> $CONF
        echo "CONFIG_UNICODE=y" >> $CONF
        
        echo "CONFIG_LOCALVERSION=\"-HMBIRD-V57-ULTIMATE\"" >> $CONF

    - name: 🏗️ Compilação e Lipoaspiração (Strip)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1
        
        # Limpando o binário antes de comprimir (Garante que não seja uma "img pesada")
        llvm-strip --strip-all --strip-debug out/arch/arm64/boot/Image
        
        # 🗜️ COMPRESSÃO EXTREMA XZ (Nível 9 + Extreme Check)
        # Isso faz o arquivo de 38MB ficar minúsculo sem perder nada
        xz -9 -e -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

    - name: 📦 AnyKernel3 (Copiando a Lógica do Xennet)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp android-kernel/out/arch/arm64/boot/Image.xz AnyKernel3/Image.xz
        
        cat <<EOF > AnyKernel3/anykernel.sh
        ### AnyKernel setup
        properties() { '
        kernel.string=HMBIRD-V57-ULTIMATE by Gemini
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        ### AnyKernel install
        block=boot;
        is_slot_device=auto;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        no_magisk_check=1;

        . tools/ak3-core.sh;

        # Lógica de Detecção GKI do print que você mandou
        kernel_version=\$(cat /proc/version | awk -F '-' '{print \$1}' | awk '{print \$3}')
        case \$kernel_version in
            5.1*) ksu_supported=true ;;
            6.1*) ksu_supported=true ;;
            6.6*) ksu_supported=true ;;
            *) ksu_supported=false ;;
        esac

        ui_print " " "  -> ksu_supported: \$ksu_supported"
        \$ksu_supported || abort "  -> Non-GKI device, abort."

        split_boot;
        if [ -f "split_img/ramdisk.cpio" ]; then
            unpack_ramdisk;
            write_boot;
        else
            flash_boot;
        fi
        EOF
        
        cd AnyKernel3 && zip -r ../G75-V57-HMBIRD-BEAST.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: G75-V57-ULTIMATE
        path: G75-V57-HMBIRD-BEAST.zip
